# Bundled public example. Replace dataset_dir/output_dir for your run.
model:
  model_config:
    class_path: rfdetr.config.RFDETRSmallConfig
    init_args:
      num_classes: 3
  train_config:
    class_path: rfdetr.config.TrainConfig
    init_args:
      dataset_file: roboflow
      dataset_dir: data/my_dataset
      output_dir: outputs/rfdetr-small
      epochs: 100
      batch_size: 4
      grad_accum_steps: 4
      num_workers: 2
      tensorboard: true
