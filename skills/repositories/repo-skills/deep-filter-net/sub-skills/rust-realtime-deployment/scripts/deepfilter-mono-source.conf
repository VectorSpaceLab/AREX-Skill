# DeepFilterNet PipeWire virtual microphone/source template
#
# Purpose:
#   Create a mono virtual microphone that suppresses noise before audio reaches
#   VoIP/conferencing applications.
#
# Before launching PipeWire with this config:
#   1. Install or build the LADSPA plugin so libdeep_filter_ladspa.so exists.
#   2. Set the `plugin = ...` line below to an ABSOLUTE path to that file.
#      Do not use '~', '$HOME', or a relative path; PipeWire will not expand it.
#   3. Validate the edited config without launching PipeWire, for example:
#        python scripts/check_pipewire_config.py <this-file> --expected-label deep_filter_mono --require-plugin-exists
#
# Attenuation guidance:
#   "Attenuation Limit (dB)" must be in [0, 100]. 0 means no noise reduction;
#   6-12 is light reduction; 18-24 is medium; 100 means no attenuation limit.

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "DeepFilter Noise Canceling Source"
            media.name       = "DeepFilter Noise Canceling Source"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = "DeepFilter Mono"
                        plugin = /usr/lib/ladspa/libdeep_filter_ladspa.so
                        label  = deep_filter_mono
                        control = {
                            "Attenuation Limit (dB)" 100
                        }
                    }
                ]
            }
            audio.rate = 48000
            audio.position = [MONO]
            capture.props = {
                node.passive = true
            }
            playback.props = {
                media.class = Audio/Source
            }
        }
    }
]
